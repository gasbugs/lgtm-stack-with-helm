kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lgtm

# 컨트롤 플레인 컴포넌트의 메트릭을 ServiceMonitor가 스크랩할 수 있도록 0.0.0.0 바인딩
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        # apiserver는 기본 0.0.0.0이라 별도 패치 불필요
    controllerManager:
      extraArgs:
        bind-address: 0.0.0.0
    scheduler:
      extraArgs:
        bind-address: 0.0.0.0
    etcd:
      local:
        extraArgs:
          listen-metrics-urls: http://0.0.0.0:2381
  - |
    kind: KubeProxyConfiguration
    metricsBindAddress: 0.0.0.0:10249

nodes:
  - role: control-plane
    extraPortMappings:
      # MetalLB를 통해 LoadBalancer가 사용할 외부 노출은 metallb-spec.yaml에서 처리.
      # 디버깅용 NodePort 백업 매핑 (사용 안 해도 무해함)
      - { containerPort: 30080, hostPort: 30080, protocol: TCP }
      - { containerPort: 30081, hostPort: 30081, protocol: TCP }
  - role: worker
  - role: worker
