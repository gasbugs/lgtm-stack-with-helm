apiVersion: v1
kind: Namespace
metadata:
  name: flask-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-flask-app
  namespace: flask-app
  labels:
    app: my-flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-flask-app
  template:
    metadata:
      labels:
        app: my-flask-app
    spec:
      containers:
        - name: my-flask-app
          image: gasbugs21c/my-flask-app:lgtm-v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.otel.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "flask-demo-service"
            - name: SERVICE_VERSION
              value: "2.0.0"
            - name: DEPLOY_ENV
              value: "demo"
            - name: LOG_JSON
              value: "1"
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: my-flask-app
  namespace: flask-app
  labels:
    app: my-flask-app
spec:
  type: LoadBalancer
  selector:
    app: my-flask-app
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
