# OTel Collector DaemonSet 모드 — 각 노드에서 컨테이너 로그 + 호스트 메트릭 수집
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.158.0"

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  hostMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }

    # kind kubelet은 self-signed cert → TLS 검증 끄기
    kubeletstats:
      auth_type: serviceAccount
      endpoint: ${env:K8S_NODE_NAME}:10250
      insecure_skip_verify: true
      collection_interval: 30s
      metric_groups: [node, pod, container, volume]

    # 노드 시스템 메트릭 (kind에서는 컨테이너 안이라 cpu/load 등 일부만 정확)
    hostmetrics:
      collection_interval: 30s
      scrapers:
        cpu: {}
        load: {}
        memory: {}
        disk: {}
        filesystem: {}
        network: {}

  exporters:
    otlp_http/loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp
    prometheus_remote_write:
      endpoint: http://my-prom-kube-prometheus-st-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      resource_to_telemetry_conversion:
        enabled: true

  processors:
    batch: {}
    # k8s_attributes 는 presets.kubernetesAttributes 가 자동 구성

  service:
    pipelines:
      logs:
        receivers: [file_log, otlp]
        processors: [k8s_attributes, batch]
        exporters: [otlp_http/loki]
      metrics:
        receivers: [hostmetrics, kubeletstats, otlp]
        processors: [k8s_attributes, batch]
        exporters: [prometheus_remote_write]
