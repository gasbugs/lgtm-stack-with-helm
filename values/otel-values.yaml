mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.130.0"

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  exporters:
    # Logs -> Loki
    loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push

    # Metrics -> Prometheus (kube-prometheus-stack)
    prometheusremotewrite:
      endpoint: http://my-prom-kube-prometheus-st-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      resource_to_telemetry_conversion:
        enabled: true

    # Traces -> Tempo
    otlp/tempo:
      endpoint: tempo-distributor.monitoring.svc.cluster.local:4317
      tls:
        insecure: true

  processors:
    batch: {}

  service:
    pipelines:
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [loki]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheusremotewrite]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo]
